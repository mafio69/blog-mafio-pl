name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy blog.mafio.pl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.BLOG_SSH }}
          known_hosts: unnecessary
          if_key_exists: fail

      - name: Test SSH
        run: |
          ssh -p ${{ secrets.VPS_PORT || 10137 }} -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo SSH OK"

      - name: Deploy via rsync
        run: |
          rsync -azP --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env.local' \
            --exclude='.env.local.php' \
            --exclude='.env.dev' \
            --exclude='.env.prod' \
            --exclude='.env.prod.local' \
            --exclude='.env.test' \
            --exclude='var/' \
            --exclude='vendor/' \
            --exclude='.ai/' \
            --exclude='.kiro/' \
            --exclude='.commandcode/' \
            --exclude='.local/' \
            --exclude='.idea/' \
            --exclude='.junie/' \
            --exclude='.phpunit.cache/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='phpunit.dist.xml' \
            -e "ssh -p ${{ secrets.VPS_PORT || 10137 }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}

      - name: Post-deploy commands
        run: |
          ssh -p ${{ secrets.VPS_PORT || 10137 }} -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<EOF
              set -e
              cd "${{ secrets.VPS_DEPLOY_PATH }}"
              composer install --no-dev --optimize-autoloader --no-interaction || php composer.phar install --no-dev --optimize-autoloader --no-interaction
              php8.4 bin/console cache:clear --env=prod
              echo "Deploy completed at $(date)"
          EOF

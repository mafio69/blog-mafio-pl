name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy blog.mafio.pl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOG_SSH }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -azP --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env.local' \
            --exclude='.env.local.php' \
            --exclude='.env.dev' \
            --exclude='.env.prod' \
            --exclude='.env.prod.local' \
            --exclude='.env.test' \
            --exclude='var/' \
            --exclude='vendor/' \
            --exclude='.ai/' \
            --exclude='.kiro/' \
            --exclude='.commandcode/' \
            --exclude='.local/' \
            --exclude='.idea/' \
            --exclude='.junie/' \
            --exclude='.phpunit.cache/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='phpunit.dist.xml' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}

      - name: Post-deploy commands
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY'
              set -e
              cd ${{ secrets.VPS_DEPLOY_PATH }}
              composer install --no-dev --optimize-autoloader --no-interaction 2>/dev/null || \
                php composer.phar install --no-dev --optimize-autoloader --no-interaction
              php8.4 bin/console cache:clear --env=prod
              echo "Deploy completed at $(date)"
          DEPLOY

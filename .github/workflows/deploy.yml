name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy blog.mafio.pl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e rsync -azP --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env.local' \
            --exclude='.env.test' \
            --exclude='var/' \
            --exclude='vendor/' \
            --exclude='.ai/' \
            --exclude='.kiro/' \
            --exclude='.commandcode/' \
            --exclude='.local/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='phpunit.dist.xml' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}

      - name: Post-deploy commands
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY'
              cd ${{ secrets.VPS_DEPLOY_PATH }}
              composer install --no-dev --optimize-autoloader --no-interaction 2>/dev/null || \
                php composer.phar install --no-dev --optimize-autoloader --no-interaction
              php8.4 bin/console cache:clear --env=prod
              echo "Deploy completed at $(date)"
          DEPLOY
